<!doctype html>
<html lang="it" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OnlyGym - Ultimate Workout Tracker</title>

  <!-- Security Meta Tags -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Google Fonts: Outfit + Plus Jakarta Sans + Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">

  <!-- PWA -->
  <meta name="theme-color" content="#080b11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OnlyGym" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/logo.png" />
</head>

<body style="background: #080b11; color: #f8fafc; margin: 0; padding: 0;" class="overscroll-none font-sans antialiased">
  <div id="root">
    <!-- Loader visuale immediato: evita lo schermo nero mentre Safari scarica i file JS -->
    <div id="og-initial-loader" style="position:fixed;inset:0;background:#080b11;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;padding:24px;text-align:center;">
       <div style="width:72px;height:72px;margin-bottom:20px;border-radius:20px;background:#111726;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(13,242,137,0.2);">
          <img src="/logo.png" alt="OnlyGym" style="width:52px;height:52px;object-fit:contain;" />
       </div>
       <div style="width:34px;height:34px;border:3px solid #1e293b;border-top-color:#0df289;border-radius:50%;animation:og-spin 0.75s linear infinite;margin-bottom:14px;"></div>
       <div style="font-size:16px;font-weight:800;letter-spacing:1px;color:#f8fafc;margin-bottom:4px;">ONLYGYM</div>
       <div style="font-size:12px;color:#94a3b8;">Caricamento in corso...</div>

       <div id="og-troubleshoot" style="display:none;margin-top:24px;max-width:280px;background:#111726;padding:16px;border-radius:14px;border:1px solid #1e293f;">
          <p style="font-size:12px;color:#cbd5e1;margin-bottom:12px;line-height:1.4;">Se l'app non si avvia, aggiorna la cache toccando il pulsante:</p>
          <button id="og-reset-btn" style="background:#0df289;color:#080b11;border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;">Aggiorna e Ricarica</button>
       </div>
    </div>
  </div>

  <style>
    @keyframes og-spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    (function() {
      // Se dopo 3.5 secondi React non ha montato e rimosso l'HTML interno di #root, mostra il pulsante di ripristino
      var timer = setTimeout(function() {
        var el = document.getElementById('og-troubleshoot');
        if (el) el.style.display = 'block';
      }, 3500);

      window.__resetOnlyGym = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
        try {
          sessionStorage.clear();
        } catch(e) {}
        setTimeout(function() {
          window.location.href = window.location.origin + window.location.pathname + '?nocache=' + Date.now();
        }, 300);
      };

      document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'og-reset-btn') {
          e.target.innerText = 'Pulizia in corso...';
          window.__resetOnlyGym();
        }
      });
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
